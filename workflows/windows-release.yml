name: Desktop installer releases

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: npm run dist:win
          - platform: macos
            os: macos-latest
            command: npm run dist:mac
          - platform: linux
            os: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Ruby for Debian packages
        if: matrix.platform == 'linux'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install FPM
        if: matrix.platform == 'linux'
        run: gem install --no-document fpm

      - name: Build ${{ matrix.platform }} package
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.platform }} package files
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: release-artifacts/release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: Publish all platform packages
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          make_latest: true
